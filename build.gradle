plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            /*
             * Required for third-party dependency Mixins
             * inside the ForgeGradle development environment.
             */
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    "${projectDir}/build/createSrgToMcp/output.srg"

            /*
             * Explicitly load Feast Wine All Gone's own Mixin config
             * in the development run.
             */
            arg '-mixin.config=feastwineallgone.mixins.json'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    // Public mod dependencies. Keeping third-party JARs out of the repository
    // makes the source tree smaller and avoids redistributing other projects.
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }

    // Mixin annotation processor / MixinGradle artifacts.
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

/*
 * Generate a production refmap and attach it to the main source set.
 * This is what lets Mixin translate Mojmap names such as Camera#setPosition
 * into the SRG/runtime names used by a normal Forge installation.
 */
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin annotation processor. Required for the production refmap.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Required mods
    implementation fg.deobf('curse.maven:touhou-little-maid-355044:8061847')
    implementation fg.deobf('curse.maven:kaleidoscope-tavern-1475175:8350841')
    implementation fg.deobf('curse.maven:kaleidoscope-cookery-1309203:8945528')

    // Optional compatibility dependency used for compilation/testing.
    implementation fg.deobf('curse.maven:farmers-delight-398521:8765179')
}


tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching([
            'META-INF/mods.toml',
            'pack.mcmeta'
    ]) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'        : mod_id,
                'Specification-Vendor'       : mod_authors,
                'Specification-Version'      : '1',
                'Implementation-Title'       : project.name,
                'Implementation-Version'     : project.jar.archiveVersion,
                'Implementation-Vendor'      : mod_authors,
                'Implementation-Timestamp'   : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),

                /*
                 * Makes the Mixin config load from the final compiled mod JAR.
                 */
                'MixinConfigs'               : 'feastwineallgone.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
